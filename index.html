<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil con Google Fonts</title>

    <!-- Vinculación externa de Google Fonts (Ejemplo: Poppins y Roboto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif; /* Fuente para texto general */
            background-color: #f8fafc;
            color: #334155;
            max-width: 650px;
            margin: 30px auto;
            padding: 20px;
        }
        h1, h2 {
            font-family: 'Poppins', sans-serif; /* Fuente destacada para títulos */
            color: #0284c7;
        }
        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <h1>Diseño Tipográfico Profesional 🔤</h1>
    <div class="card">
        <h2>Jerarquía de Lectura</h2>
        <p>Combinar una fuente con carácter para los títulos y una fuente limpia para los textos mejora la estética de nuestra web.</p>
    </div>
</body>
</html>
